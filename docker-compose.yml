services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fpp
      POSTGRES_PASSWORD: fpp_changeme
      POSTGRES_DB: fpp_dev
    ports:
      - "5432:5432"
    volumes:
      - fpp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpp -d fpp_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fpp_pgdata:
